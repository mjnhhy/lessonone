<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You received a gift!</title>
    <!-- Font chữ cute & hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #f0f9ff 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Thẻ Thiệp Thiết Kế */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 45px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(186, 230, 253, 0.6);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 2px solid #ffffff;
            position: relative;
            z-index: 10;
            transition: all 0.5s ease;
        }

        /* Phần Hộp Quà Nitro giả lập lúc chưa bấm */
        .nitro-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .nitro-badge {
            background: linear-gradient(135deg, #ff73fa 0%, #f717f3 100%);
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(247, 23, 243, 0.3);
            margin-bottom: 15px;
            font-family: 'Comfortaa', cursive;
        }

        .nitro-sub {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* Phần Nội Dung Chúc Mừng (Ẩn lúc đầu) */
        .birthday-content {
            display: none;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Comfortaa', cursive;
            color: #0284c7;
            font-size: 26px;
            margin-bottom: 12px;
        }

        p {
            color: #475569;
            font-size: 16px;
            line-height: 1.6;
            font-weight: 500;
        }

        /* Nút Tương Tác */
        .btn-play {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(2, 132, 199, 0.3);
            transition: all 0.3s ease;
            outline: none;
        }
        .btn-play:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(2, 132, 199, 0.4);
        }
        .btn-play:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <!-- Thiệp Sinh Nhật -->
    <div class="card" id="birthdayCard">
        
        <!-- Màn hình Nitro ban đầu -->
        <div class="nitro-box" id="nitroBox">
            <div class="nitro-badge">🚀 Discord Nitro Gift</div>
            <div class="nitro-sub">Bạn vừa nhận được một món quà đặc biệt!</div>
            <button class="btn-play" onclick="openGift()">Nhận quà ngay ✨</button>
        </div>

        <!-- Nội dung sinh nhật lộ ra sau khi bấm -->
        <div class="birthday-content" id="birthdayContent">
            <h1>Happy Birthday<br>Ngọc Big 💙✨</h1>
            <p>Chúc <b>Bé Cún</b> tuổi mới phát tài,<br>thành "công" rực rỡ nha! 🎉🎂🎁</p>
        </div>

    </div>

    <!-- Nhạc Sinh Nhật MP3 Chuẩn Đét 100% Phát Được -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2702/2702-preview.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        function openGift() {
            // An Nitro box & hien noi dung sinh nhat
            document.getElementById('nitroBox').style.display = 'none';
            document.getElementById('birthdayContent').style.display = 'block';
            
            // Phat nhac MP3
            var audio = document.getElementById('bg-music');
            audio.play().catch(function(e) {
                console.log("Audio play error:", e);
            });

            // Ban phao hoa
            var count = 200;
            var defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }
    </script>
</body>
</html>
