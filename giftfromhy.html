<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Ngọc Big 💙</title>
    <!-- Font chữ cute & hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #f0f9ff 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng bong bóng / trái tim pastel bay nhẹ */
        .floating-item {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp 6s linear infinite;
            opacity: 0.8;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* Thẻ Thiệp Thiết Kế Pastel */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(186, 230, 253, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 2px solid #ffffff;
            position: relative;
            z-index: 10;
            transform: scale(0.9);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            to { transform: scale(1); }
        }

        .avatar-box {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #3b82f6;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
            font-size: 50px;
        }

        h1 {
            font-family: 'Comfortaa', cursive;
            color: #0284c7;
            font-size: 26px;
            margin-bottom: 12px;
        }

        p {
            color: #475569;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* Nút Tương Tác */
        .btn-play {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(2, 132, 199, 0.3);
            transition: all 0.3s ease;
            outline: none;
        }
        .btn-play:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(2, 132, 199, 0.4);
        }
        .btn-play:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <!-- Thiệp Sinh Nhật -->
    <div class="card">
        <div class="avatar-box">🐶</div>
        <h1>Happy Birthday<br>Ngọc Big 💙✨</h1>
        <p>Chúc <b>Bé Cún</b> tuổi mới phát tài,<br>thành "công" rực rỡ nha! 🎉🎂🎁</p>
        <button class="btn-play" onclick="playEffects()">Ấn vào đây nè! 🎵</button>
    </div>

    <!-- Nhạc Sinh Nhật MP3 Chuẩn -->
    <audio id="bg-music" loop>
        <source src="https://codeskulptor-demos.commondatastorage.googleapis.com/descent/got.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        // Tạo các biểu tượng cún & trái tim bay lơ lửng
        const icons = ['🐶', '💙', '✨', '🐾', '🎈'];
        function createFloatingItem() {
            const item = document.createElement('div');
            item.classList.add('floating-item');
            item.innerText = icons[Math.floor(Math.random() * icons.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.body.appendChild(item);

            setTimeout(() => { item.remove(); }, 7000);
        }
        setInterval(createFloatingItem, 400);

        // Phát nhạc & bắn pháo hoa khi bấm nút
        function playEffects() {
            const audio = document.getElementById('bg-music');
            audio.play();

            // Bắn pháo hoa rực rỡ
            var count = 200;
            var defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }
    </script>
</body>
</html>
