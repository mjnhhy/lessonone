<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You received a gift!</title>
    <!-- Font chữ cute & hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            transition: background 1.5s ease;
        }

        /* Nền pastel chuyển màu mịn màng sau khi bấm mở quà */
        body.opened {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #f0f9ff 100%);
        }

        /* Hiệu ứng bong bóng / cún / tim bay lơ lửng */
        .floating-item {
            position: absolute;
            bottom: -50px;
            font-size: 28px;
            animation: floatUp 4.5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
            opacity: 0.9;
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.15));
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.6); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-115vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* Thẻ Thiệp */
        .card {
            background: rgba(30, 27, 75, 0.85);
            backdrop-filter: blur(20px);
            padding: 42px 32px;
            border-radius: 32px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 390px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 10;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card.light-theme {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 20px 50px rgba(186, 230, 253, 0.8);
            border: 2px solid #ffffff;
        }

        /* Giao diện Nitro màn hình đầu */
        .nitro-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .nitro-icon {
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, #f472b6, #db2777);
            border-radius: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 12px 25px rgba(219, 39, 119, 0.45);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .nitro-icon svg { width: 48px; fill: white; }

        .nitro-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            font-family: 'Comfortaa', cursive;
        }

        .heart-sub {
            font-size: 32px;
            margin-bottom: 25px;
            animation: heartBeat 1.2s infinite;
        }
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        /* Nội dung Sinh Nhật (ẩn lúc đầu) */
        .birthday-content {
            display: none;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .birthday-content.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .avatar-box {
            width: 95px;
            height: 95px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #3b82f6;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
            font-size: 48px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-family: 'Comfortaa', cursive;
            color: #0284c7;
            font-size: 25px;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .typing-text {
            color: #475569;
            font-size: 16px;
            line-height: 1.7;
            font-weight: 600;
            min-height: 80px;
        }

        /* Nút Accept Gift */
        .btn-claim {
            background: linear-gradient(135deg, #f472b6, #ec4899);
            color: white;
            border: none;
            padding: 15px 36px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(244, 114, 182, 0.4);
            transition: all 0.3s ease;
            outline: none;
        }
        .btn-claim:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 30px rgba(244, 114, 182, 0.6);
        }
        .btn-claim:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <!-- Nitro Screen -->
        <div class="nitro-box" id="nitroBox">
            <div class="nitro-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <div class="nitro-title">You received a gift!</div>
            <div class="heart-sub">🩷✨</div>
            <button class="btn-claim" onclick="openGift()">Accept Gift</button>
        </div>

        <!-- Birthday Content Screen -->
        <div class="birthday-content" id="birthdayContent">
            <div class="avatar-box">🐶</div>
            <h1>Happy Birthday<br>Ngoc Bich x ᵠᵛ 💙✨</h1>
            <div class="typing-text" id="typewriter"></div>
        </div>
    </div>

    <!-- Nhạc Piano Sinh Nhật Mượt Tròn Trịn -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://ia801503.us.archive.org/15/items/HappyBirthdayToYou_201802/HappyBirthdayToYou.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        const lines = [
            "chúc ngoc bich x ᵠᵛ",
            "tuổi mới thành \"công\" phát tài",
            "lon dep nhu hoaa 🎉🎂🎁"
        ];
        
        let lineIdx = 0;
        let charIdx = 0;

        function typeWriter() {
            const container = document.getElementById("typewriter");
            if (lineIdx < lines.length) {
                if (charIdx < lines[lineIdx].length) {
                    container.innerHTML += lines[lineIdx].charAt(charIdx);
                    charIdx++;
                    setTimeout(typeWriter, 45);
                } else {
                    container.innerHTML += "<br>";
                    lineIdx++;
                    charIdx = 0;
                    setTimeout(typeWriter, 300);
                }
            }
        }

        function startFloatingIcons() {
            const icons = ['🐶', '💙', '✨', '🐾', '🎈', '🎂', '🎁', '🩷', '🌸'];
            setInterval(() => {
                const item = document.createElement('div');
                item.classList.add('floating-item');
                item.innerText = icons[Math.floor(Math.random() * icons.length)];
                item.style.left = Math.random() * 92 + 'vw';
                item.style.animationDuration = (Math.random() * 2 + 3.5) + 's';
                document.body.appendChild(item);

                setTimeout(() => { item.remove(); }, 5000);
            }, 250);
        }

        function openGift() {
            document.body.classList.add('opened');
            const card = document.getElementById('mainCard');
            
            document.getElementById('nitroBox').style.display = 'none';
            card.classList.add('light-theme');
            
            const content = document.getElementById('birthdayContent');
            content.classList.add('show');

            setTimeout(typeWriter, 300);
            startFloatingIcons();

            var audio = document.getElementById('bg-music');
            audio.play().catch(e => console.log(e));

            var duration = 3.5 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 6,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 6,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            })();
        }
    </script>
</body>
</html>
